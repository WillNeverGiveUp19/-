[project]
name = "hackathon-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "WillNeverGiveUp19", email = "https://github.com/WillNeverGiveUp19/Leetcode_Learning.git" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-chroma>=1.1.0",
    "langchain-milvus>=0.4.0",
    "langchain-openai>=1.7.4",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "notebook>=7.6.5",
    "openai>=3.46.0",
    "pymilvus[milvus-lite]>=3.0.2",
    "python-dotenv>=1.2.4",
]

[project.scripts]
hackathon-agent = "hackathon_agent:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.42",
]
